[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  ".venv",
  "Lecture_*.ipynb",
  "multHelpers.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
  # Single-letter names such as l and I are common in algorithm notation.
  "E741",
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = [".venv"]
